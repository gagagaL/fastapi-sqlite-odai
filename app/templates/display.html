{% block content %}
<div class="row" style="width: 100%; height: 100%; background-color: #000">
    <div class="col-12">
        <div id="bubble-container" class="border rounded p-0 bg-primary bg-opacity-10" style="height: 100vh; position: relative; overflow: hidden;">
            <!-- ここに単語の泡が表示されます -->
            <!-- 出題中のお題表示（位置調整可能） -->
            <div id="active-odai-display" class="hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; text-align: center; transition: all 0.3s ease-in-out; width: 800px; max-width: 90vw;">
                <p id="active-odai-text" style="color: white; font-size: 48px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin: 0; word-wrap: break-word; overflow-wrap: break-word;"></p>
            </div>
        </div>
    </div>
</div>

<script>
// 単語データを取得
const initialWords = JSON.parse('{{ words|tojson|safe }}');
let displayedWordIds = []; // 表示済みの単語IDを記録
let activeBubbles = []; // アクティブな泡要素を管理
let stoppedBubbles = []; // 停止した泡要素を管理
let currentTopPosition = 50; // 現在のtop位置（%）
let currentFontSize = 48; // 現在のフォントサイズ（px）
let currentWidthPx = 800; // 現在の横幅（px）
const BUBBLE_MARGIN = 15; // 泡同士の最小マージン（適度に調整）
const COLLISION_FORCE = 0.3; // 衝突時の反発力（大幅に弱く）
const MAX_ATTEMPTS = 50; // 位置調整の最大試行回数
const DAMPING = 0.95; // 減衰係数（動きを滑らかにする）
const STOP_DURATION = 3000; // 停止判定時間（3秒）

// 表示設定を更新する関数
function updateDisplaySettings(topPercent, fontSize, widthPx) {
    const activeDisplay = document.getElementById('active-odai-display');
    const odaiText = document.getElementById('active-odai-text');
    
    console.log('updateDisplaySettings called with:', { topPercent, fontSize, widthPx });
    
    if (activeDisplay && odaiText) {
        // 位置を更新
        activeDisplay.style.top = `${topPercent}%`;
        currentTopPosition = topPercent;
        console.log('位置を更新:', `${topPercent}%`);
        
        // フォントサイズを更新
        odaiText.style.fontSize = `${fontSize}px`;
        currentFontSize = fontSize;
        console.log('フォントサイズを更新:', `${fontSize}px`);
        
        // 横幅を更新
        activeDisplay.style.width = `${widthPx}px`;
        currentWidthPx = widthPx;
        console.log('横幅を更新:', `${widthPx}px`);
    } else {
        console.error('要素が見つかりません:', { activeDisplay, odaiText });
    }
}

// 表示設定をAPIから取得
async function loadPositionSettings() {
    try {
        const response = await fetch('/api/display/position');
        if (response.ok) {
            const result = await response.json();
            console.log('取得した表示設定:', result);
            
            const topPosition = result.top_position || 50;
            const fontSize = result.font_size || 48;
            const widthPx = result.width_px || 800;
            
            console.log('適用する設定:', { topPosition, fontSize, widthPx });
            updateDisplaySettings(topPosition, fontSize, widthPx);
        }
    } catch (error) {
        console.error('表示設定取得エラー:', error);
        // デフォルト値を使用
        updateDisplaySettings(50, 48, 800);
    }
}

// 単語の泡を生成する関数
function createBubbles() {
    // 既存の単語を表示
    initialWords.forEach(word => {
        displayedWordIds.push(word.id);
        createBubble(word.word);
    });
    
    // 定期的に新しい単語を確認
    setupPolling();
    
    // 衝突検出を開始（より低頻度で滑らかに）
    setInterval(checkCollisions, 100); // 衝突検出の頻度を下げる
}

// すべての泡の衝突をチェック
function checkCollisions() {
    if (activeBubbles.length < 2) return;
    
    for (let i = 0; i < activeBubbles.length; i++) {
        const bubble1 = activeBubbles[i];
        if (bubble1.dataset.state === 'stopped') continue; // 停止中の泡はスキップ
        
        const rect1 = bubble1.getBoundingClientRect();
        const container = document.getElementById('bubble-container');
        const containerRect = container.getBoundingClientRect();
        
        // 画面上での実際の位置を計算
        const bubble1Left = rect1.left - containerRect.left;
        const bubble1Top = containerRect.height - (rect1.top - containerRect.top + rect1.height);
        const bubble1Right = bubble1Left + rect1.width;
        const bubble1Bottom = bubble1Top + rect1.height;
        const bubble1CenterX = bubble1Left + rect1.width / 2;
        const bubble1CenterY = bubble1Top + rect1.height / 2;
        
        // 他のすべての泡と衝突チェック
        for (let j = 0; j < activeBubbles.length; j++) {
            if (i === j) continue;
            
            const bubble2 = activeBubbles[j];
            const rect2 = bubble2.getBoundingClientRect();
            
            const bubble2Left = rect2.left - containerRect.left;
            const bubble2Top = containerRect.height - (rect2.top - containerRect.top + rect2.height);
            const bubble2Right = bubble2Left + rect2.width;
            const bubble2Bottom = bubble2Top + rect2.height;
            const bubble2CenterX = bubble2Left + rect2.width / 2;
            const bubble2CenterY = bubble2Top + rect2.height / 2;
            
            // 中心点間の距離を計算
            const dx = bubble2CenterX - bubble1CenterX;
            const dy = bubble2CenterY - bubble1CenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 必要な最小距離（両方の泡の半径 + マージン）
            const minDistance = (rect1.width + rect2.width) / 2 + BUBBLE_MARGIN;
            
            if (distance < minDistance && distance > 0) {
                // 衝突発生時の処理
                handleBubbleCollision(bubble1, bubble2, dx, dy, distance, minDistance);
                break; // この泡については次へ
            }
        }
    }
}

// 泡同士の衝突処理
function handleBubbleCollision(bubble1, bubble2, dx, dy, distance, minDistance) {
    const container = document.getElementById('bubble-container');
    const containerWidth = container.offsetWidth;
    const containerHeight = container.offsetHeight;
    
    // 現在の位置を取得
    const left1 = parseFloat(bubble1.style.left);
    const bottom1 = parseFloat(bubble1.style.bottom);
    const left2 = parseFloat(bubble2.style.left);
    const bottom2 = parseFloat(bubble2.style.bottom);
    
    // 重複を解消するための移動距離を計算（より滑らかに）
    const overlap = minDistance - distance;
    const moveDistance = overlap / 2 + 2; // より小さな移動距離
    
    // 正規化された方向ベクトル
    const normalizedDx = dx / distance;
    const normalizedDy = dy / distance;
    
    // 現在の速度を取得
    const vx1 = parseFloat(bubble1.dataset.vx || 0);
    const vy1 = parseFloat(bubble1.dataset.vy || 0);
    const vx2 = parseFloat(bubble2.dataset.vx || 0);
    const vy2 = parseFloat(bubble2.dataset.vy || 0);
    
    // より滑らかな位置調整（段階的に移動）
    const adjustmentFactor = 0.3; // 一度に移動する距離を制限
    const newLeft1 = left1 - normalizedDx * moveDistance * adjustmentFactor;
    const newBottom1 = bottom1 - normalizedDy * moveDistance * adjustmentFactor;
    const newLeft2 = left2 + normalizedDx * moveDistance * adjustmentFactor;
    const newBottom2 = bottom2 + normalizedDy * moveDistance * adjustmentFactor;
    
    // 容器内に収まるように調整
    const bubble1Width = bubble1.offsetWidth;
    const bubble1Height = bubble1.offsetHeight;
    const bubble2Width = bubble2.offsetWidth;
    const bubble2Height = bubble2.offsetHeight;
    
    const boundedLeft1 = Math.max(0, Math.min(containerWidth - bubble1Width, newLeft1));
    const boundedBottom1 = Math.max(0, Math.min(containerHeight - bubble1Height, newBottom1));
    const boundedLeft2 = Math.max(0, Math.min(containerWidth - bubble2Width, newLeft2));
    const boundedBottom2 = Math.max(0, Math.min(containerHeight - bubble2Height, newBottom2));
    
    // 位置を更新
    bubble1.style.left = `${boundedLeft1}px`;
    bubble1.style.bottom = `${boundedBottom1}px`;
    bubble2.style.left = `${boundedLeft2}px`;
    bubble2.style.bottom = `${boundedBottom2}px`;
    
    // より滑らかな反発力の計算
    const repulsionForce = COLLISION_FORCE * (1 - overlap / minDistance); // 重複度に応じて力を調整
    
    // 現在の速度に減衰を適用してから反発力を追加
    const dampedVx1 = vx1 * DAMPING;
    const dampedVy1 = vy1 * DAMPING;
    const dampedVx2 = vx2 * DAMPING;
    const dampedVy2 = vy2 * DAMPING;
    
    // 反発力を設定（既存の速度に加算）
    bubble1.dataset.vx = (dampedVx1 - normalizedDx * repulsionForce).toString();
    bubble1.dataset.vy = (dampedVy1 - normalizedDy * repulsionForce).toString();
    bubble2.dataset.vx = (dampedVx2 + normalizedDx * repulsionForce).toString();
    bubble2.dataset.vy = (dampedVy2 + normalizedDy * repulsionForce).toString();
    
    // 反発後の動きを継続（より長い時間で滑らかに）
    continueMovement(bubble1, 500); // より長い時間
    continueMovement(bubble2, 500);
}

// 衝突後の動き
function continueMovement(bubble, customDuration = null) {
    // 停止した泡は動かさない
    if (bubble.dataset.stopped === 'true') {
        return;
    }
    
    const startTime = Date.now();
    const duration = customDuration || 600; // より長い時間で滑らかに
    const initialLeft = parseFloat(bubble.style.left);
    const initialBottom = parseFloat(bubble.style.bottom);
    const vx = parseFloat(bubble.dataset.vx);
    const vy = parseFloat(bubble.dataset.vy);
    
    function moveFrame() {
        // 停止した泡は動かさない
        if (bubble.dataset.stopped === 'true') {
            return;
        }
        const now = Date.now();
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // より滑らかな減衰（イージング関数）
        const dampening = Math.pow(1 - progress, 2); // より自然な減衰
        
        // 現在の位置を計算（より滑らかな移動）
        const currentLeft = initialLeft + vx * progress * 3 * dampening; // より小さな移動距離
        const currentBottom = initialBottom + vy * progress * 3 * dampening;
        
        // 位置を更新
        bubble.style.left = `${currentLeft}px`;
        bubble.style.bottom = `${currentBottom}px`;
        
        // 容器の端に到達したらバウンド（より滑らかに）
        const container = document.getElementById('bubble-container');
        const bubbleWidth = bubble.offsetWidth;
        const bubbleHeight = bubble.offsetHeight;
        const containerWidth = container.offsetWidth;
        const containerHeight = container.offsetHeight;
        
        // X方向の境界チェック
        if (currentLeft <= 0) {
            bubble.style.left = '0px';
            bubble.dataset.vx = (Math.abs(vx) * 0.3).toString(); // より弱い反発
        } else if (currentLeft + bubbleWidth >= containerWidth) {
            bubble.style.left = `${containerWidth - bubbleWidth}px`;
            bubble.dataset.vx = (-Math.abs(vx) * 0.3).toString();
        }
        
        // Y方向の境界チェック
        if (currentBottom <= 0) {
            bubble.style.bottom = '0px';
            bubble.dataset.vy = (Math.abs(vy) * 0.3).toString();
        } else if (currentBottom + bubbleHeight >= containerHeight) {
            bubble.style.bottom = `${containerHeight - bubbleHeight}px`;
            bubble.dataset.vy = (-Math.abs(vy) * 0.3).toString();
        }
        
        if (progress < 1) {
            requestAnimationFrame(moveFrame);
        } else {
            // 動きが終了したら速度をリセット
            bubble.dataset.vx = "0";
            bubble.dataset.vy = "0";
        }
    }
    
    requestAnimationFrame(moveFrame);
}

function createBubble(text) {
    const container = document.getElementById('bubble-container');
    const containerWidth = container.offsetWidth;
    const containerHeight = container.offsetHeight;
    
    // 実際に表示する要素（a要素を使用）
    const bubble = document.createElement('a');
    bubble.className = 'word-bubble';
    bubble.href = 'javascript:void(0);'; // クリック時の動作は無効化
    bubble.textContent = text;
    
    // スタイル設定
    bubble.style.position = 'absolute';
    bubble.style.textDecoration = 'none';
    bubble.style.display = 'inline-block';
    bubble.style.padding = '8px 10px';
    bubble.style.fontSize = '24px';
    bubble.style.fontWeight = 'bold';
    bubble.style.color = '#0d6efd';
    // bubble.style.textShadow = '0 0 5px rgba(255, 255, 255, 0.7)';
    bubble.style.borderRadius = '20px';
    
    // 初期位置（画面外から）
    const startX = Math.random() * (containerWidth - 100);
    bubble.style.left = `${startX}px`;
    bubble.style.bottom = '-50px';
    
    // 360度ランダムな角度で登場
    const randomAngle = Math.random() * 360;
    bubble.style.transform = `rotate(${randomAngle}deg)`;
    
    // データ属性を設定
    bubble.dataset.state = 'rising'; // 上昇中
    bubble.dataset.vx = "0";         // X方向速度
    bubble.dataset.vy = "0";         // Y方向速度
    
    // 要素をDOMに追加
    container.appendChild(bubble);
    
    // アクティブな泡リストに追加
    activeBubbles.push(bubble);
    
    // アニメーション開始
    animateBubble(bubble, startX, randomAngle);
}

// 位置の重複を避けるための関数
function findNonOverlappingPosition(containerWidth, containerHeight, bubbleWidth, bubbleHeight) {
    let attempts = 0;
    let bestPosition = null;
    let minOverlap = Infinity;
    
    while (attempts < MAX_ATTEMPTS) {
        const x = Math.random() * (containerWidth - bubbleWidth);
        const y = Math.random() * (containerHeight - bubbleHeight);
        
        let overlap = 0;
        for (const existingBubble of activeBubbles) {
            if (existingBubble.dataset.state === 'stopped') {
                const existingRect = existingBubble.getBoundingClientRect();
                const containerRect = document.getElementById('bubble-container').getBoundingClientRect();
                const existingLeft = existingRect.left - containerRect.left;
                const existingTop = containerRect.height - (existingRect.top - containerRect.top + existingRect.height);
                
                const dx = (existingLeft + existingRect.width / 2) - (x + bubbleWidth / 2);
                const dy = (existingTop + existingRect.height / 2) - (y + bubbleHeight / 2);
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = (bubbleWidth + existingRect.width) / 2 + BUBBLE_MARGIN;
                
                if (distance < minDistance) {
                    overlap += minDistance - distance;
                }
            }
        }
        
        if (overlap === 0) {
            return { x, y };
        }
        
        if (overlap < minOverlap) {
            minOverlap = overlap;
            bestPosition = { x, y };
        }
        
        attempts++;
    }
    
    return bestPosition || { x: Math.random() * (containerWidth - bubbleWidth), y: Math.random() * (containerHeight - bubbleHeight) };
}

function animateBubble(bubble, startX, initialAngle) {
    const container = document.getElementById('bubble-container');
    const containerHeight = container.offsetHeight;
    const containerWidth = container.offsetWidth;
    
    // アニメーションパラメータ（上昇速度を遅く）
    const duration = 12000 + Math.random() * 6000; // より長い時間で上昇（遅く）
    const swayRange = 20; // より大きな揺れ
    const startTime = Date.now();
    const endY = containerHeight - 60; // より高い位置まで上昇
    
    // 停止判定用の変数
    let lastMoveTime = startTime;
    let lastY = 0;
    let stopStartTime = null;
    
    function frame() {
        const now = Date.now();
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // アニメーション状態をチェック
        if (bubble.dataset.state !== 'rising') {
            // 他の状態（衝突反発中など）ならアニメーション停止
            return;
        }
        
        // イージング関数（より自然な上昇）
        const easedProgress = 1 - Math.pow(1 - progress, 2);
        const currentY = easedProgress * endY;
        
        // 左右の揺れ（より複雑なパターン）
        const swayX = Math.sin(progress * Math.PI * 2) * swayRange + 
                     Math.sin(progress * Math.PI * 4) * (swayRange * 0.3);
        
        // 角度変化（より自然な回転）
        const angleVariation = Math.sin(progress * Math.PI * 1.5) * 8 + 
                              Math.sin(progress * Math.PI * 3) * 3;
        const currentAngle = initialAngle + angleVariation;
        
        // 位置とスタイルを適用
        bubble.style.bottom = `${currentY}px`;
        bubble.style.left = `${startX + swayX}px`;
        bubble.style.transform = `rotate(${currentAngle}deg)`;
        
        // 停止判定（Y位置の変化をチェック）
        const yChange = Math.abs(currentY - lastY);
        if (yChange < 1) { // 1px未満の移動なら停止とみなす
            if (stopStartTime === null) {
                stopStartTime = now;
            } else if (now - stopStartTime >= STOP_DURATION) {
                // 3秒間停止したら固定
                bubble.dataset.state = 'stopped';
                bubble.dataset.stopped = 'true';
                bubble.style.transform = `rotate(${currentAngle}deg)`;
                // アクティブリストから停止リストに移動
                const index = activeBubbles.indexOf(bubble);
                if (index > -1) {
                    activeBubbles.splice(index, 1);
                    stoppedBubbles.push(bubble);
                }
                return;
            }
        } else {
            // 動いている場合は停止時間をリセット
            stopStartTime = null;
        }
        
        lastY = currentY;
        lastMoveTime = now;
        
        // 上部に到達したら天井バウンド
        if (progress === 1) {
            bubble.dataset.state = 'ceiling';
            ceilingBounce(bubble);
            return;
        }
        
        // 次のフレーム
        requestAnimationFrame(frame);
    }
    
    // アニメーション開始
    requestAnimationFrame(frame);
}

function ceilingBounce(bubble) {
    const startTime = Date.now();
    const duration = 800;
    const bounceHeight = 5; // 非常に小さいバウンド
    
    const initialBottom = parseFloat(bubble.style.bottom);
    const initialLeft = parseFloat(bubble.style.left);
    const initialAngle = getRotationAngle(bubble);
    
    function bounceFrame() {
        const now = Date.now();
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // イージング（より緩やかに）
        const easedProgress = 1 - Math.pow(1 - progress, 2);
        
        // 真下方向の小さなバウンド
        const bounceY = Math.sin(Math.PI * easedProgress) * bounceHeight;
        
        // バウンド適用
        bubble.style.bottom = `${initialBottom - bounceY}px`;
        
        // 非常に軽い角度変化
        const angleChange = Math.sin(Math.PI * easedProgress) * 2;
        bubble.style.transform = `rotate(${initialAngle + angleChange}deg)`;
        
        if (progress < 1) {
            requestAnimationFrame(bounceFrame);
        } else {
            // バウンド完了、停止状態へ
            bubble.dataset.state = 'stopped';
            bubble.dataset.stopped = 'true';
            bubble.style.bottom = `${initialBottom}px`;
            bubble.style.transform = `rotate(${initialAngle}deg)`;
            // アクティブリストから停止リストに移動
            const index = activeBubbles.indexOf(bubble);
            if (index > -1) {
                activeBubbles.splice(index, 1);
                stoppedBubbles.push(bubble);
            }
        }
    }
    
    requestAnimationFrame(bounceFrame);
}

// 要素の回転角度を取得するヘルパー関数
function getRotationAngle(element) {
    const style = window.getComputedStyle(element);
    const transform = style.getPropertyValue('transform');
    
    if (transform === 'none') return 0;
    
    const values = transform.split('(')[1].split(')')[0].split(',');
    const a = values[0];
    const b = values[1];
    const angle = Math.round(Math.atan2(b, a) * (180/Math.PI));
    
    return angle;
}

// ポーリングによるリアルタイム更新
function setupPolling() {
    setInterval(fetchNewWords, 1000);
}

// 新しい単語を取得
async function fetchNewWords() {
    try {
        const response = await fetch('/api/display/words');
        const data = await response.json();
        
        // 新しい単語があれば追加
        if (data.words && data.words.length > 0) {
            data.words.forEach(word => {
                // まだ表示されていない単語のみ表示
                if (!displayedWordIds.includes(word.id)) {
                    displayedWordIds.push(word.id);
                    // 0.5秒間隔で順に表示
                    setTimeout(() => {
                        createBubble(word.word);
                    }, displayedWordIds.indexOf(word.id) * 500);
                }
            });
        }
    } catch (error) {
        console.error('Error fetching new words:', error);
    }
}


// 出題中のお題の監視
let currentActiveOdaiId = null;

// 出題中のお題を取得・表示
async function loadActiveOdai() {
    try {
        const response = await fetch('/api/confirmed-odais/active');
        const result = await response.json();
        
        const activeDisplay = document.getElementById('active-odai-display');
        const odaiText = document.getElementById('active-odai-text');
        
        if (response.ok && result.active_odai) {
            // 出題中のお題が変わったかチェック
            if (currentActiveOdaiId !== result.active_odai.id) {
                console.log('出題中のお題が変更されました:', result.active_odai.odai_text);
                currentActiveOdaiId = result.active_odai.id;
                
                // アニメーション効果を追加
                activeDisplay.style.opacity = '0';
                setTimeout(() => {
                    odaiText.textContent = result.active_odai.odai_text;
                    // 現在の表示設定を適用
                    updateDisplaySettings(currentTopPosition, currentFontSize, currentWidthPx);
                    activeDisplay.classList.remove('hidden');
                    activeDisplay.style.opacity = '1';
                }, 200);
            }
        } else {
            // 出題中のお題がない場合
            if (currentActiveOdaiId !== null) {
                console.log('出題中のお題が解除されました');
                currentActiveOdaiId = null;
                activeDisplay.style.opacity = '0';
                setTimeout(() => {
                    activeDisplay.classList.add('hidden');
                }, 200);
            }
        }
    } catch (error) {
        console.error('出題中お題取得エラー:', error);
        const activeDisplay = document.getElementById('active-odai-display');
        if (currentActiveOdaiId !== null) {
            currentActiveOdaiId = null;
            activeDisplay.classList.add('hidden');
        }
    }
}

// ページ読み込み時に実行
document.addEventListener('DOMContentLoaded', function() {
    createBubbles();
    loadActiveOdai(); // 出題中のお題を読み込み
    loadPositionSettings(); // 位置設定をAPIから取得
    
    // 定期的に出題中のお題を更新（2秒間隔でリアルタイム監視）
    setInterval(loadActiveOdai, 2000);
    
    // 定期的に位置設定を更新（5秒間隔）
    setInterval(loadPositionSettings, 5000);
    
    // 管理画面からの通知を受信
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'odai_updated') {
            console.log('管理画面から出題更新の通知を受信');
            // 即座に更新
            loadActiveOdai();
        }
        if (event.data && event.data.type === 'position_updated') {
            console.log('管理画面から位置更新の通知を受信');
            // 即座に位置設定を更新
            loadPositionSettings();
        }
    });
});
</script>
{% endblock %}
