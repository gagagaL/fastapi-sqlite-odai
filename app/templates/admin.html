{% extends "base.html" %}

{% block title %}管理画面 - {{ title }}{% endblock %}

{% block content %}
<div class="space-y-8">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-900">🔧 システム管理画面</h1>
        </div>
        
        <!-- スクレイピング機能 -->
        <div class="p-6">
            <h2 class="text-xl font-semibold text-gray-900 mb-6">🕷️ ニュース収集機能</h2>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- 収集設定 -->
                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">収集設定</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">記事数/サイト</label>
                            <input type="number" id="articlesPerSite" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" value="2" min="1" max="5">
                            <p class="text-sm text-gray-500 mt-1">各サイトから取得する記事数</p>
                        </div>
                        <button onclick="runFullPipelineAll()" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors shadow-md">
                            🌐 全サイト収集＋単語抽出（全カテゴリ）
                        </button>
                    </div>
                </div>
                
                <!-- システム状態 -->
                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">システム状態</h3>
                    <div class="space-y-4">
                        <button onclick="checkDatabaseStatus()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition-colors border border-gray-300">
                            🗄️ DB状態確認
                        </button>
                        <div id="logArea" class="border border-gray-300 rounded-lg p-4 h-80 overflow-y-auto bg-gray-50">
                            <p class="text-sm text-gray-500">ここに実行ログが表示されます...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 単語管理 -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <h2 class="text-xl font-semibold text-gray-900">🔤 抽出単語管理</h2>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="wordSearch" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" placeholder="単語検索..." style="width: 200px;">
                    <button onclick="searchWords()" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg transition-colors">検索</button>
                    <button onclick="loadWords()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-lg transition-colors border border-gray-300">🔄</button>
                </div>
            </div>
        </div>
        <div class="p-6">
            <div id="wordsArea">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600 mx-auto"></div>
                    <p class="text-gray-600 mt-2">単語リストを読み込み中...</p>
                </div>
            </div>
            <div id="wordsPagination" class="mt-6"></div>
        </div>
    </div>

    <!-- 統計情報 -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-900">📊 統計情報</h2>
                <button onclick="loadStats()" class="px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg transition-colors">
                    🔄 更新
                </button>
            </div>
        </div>
        <div class="p-6">
            <div id="statsArea">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600 mx-auto"></div>
                    <p class="text-gray-600 mt-2">統計情報を読み込み中...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 基本機能 -->
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-900">📊 基本機能</h2>
        </div>
        <div class="p-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <button onclick="initSampleData()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors">
                    🎲 サンプルデータ投入
                </button>
                <button onclick="repairDatabase()" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-medium rounded-lg transition-colors">
                    🔧 データベース修復
                </button>
                <a href="/docs" target="_blank" class="px-4 py-2 bg-white hover:bg-gray-50 text-primary-700 font-medium rounded-lg transition-colors border border-primary-300 text-center">
                    📖 API仕様
                </a>
                <button onclick="checkStats()" class="px-4 py-2 bg-white hover:bg-gray-50 text-blue-700 font-medium rounded-lg transition-colors border border-blue-300">
                    📊 統計確認
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
const perPage = 20;

// ログ出力関数
function addLog(message, type = 'info') {
    const logArea = document.getElementById('logArea');
    const timestamp = new Date().toLocaleTimeString();
    const logClass = type === 'error' ? 'text-danger' : type === 'success' ? 'text-success' : 'text-primary';
    
    const logEntry = `<div class="${logClass}"><small>[${timestamp}]</small> ${message}</div>`;
    logArea.innerHTML += logEntry;
    logArea.scrollTop = logArea.scrollHeight;
}


// データベース修復
async function repairDatabase() {
    addLog('🔧 データベース修復を開始...');
    
    try {
        const response = await fetch('/api/admin/repair-database', {method: 'POST'});
        const result = await response.json();
        
        if (response.ok) {
            addLog(`✅ ${result.message}`, 'success');
            loadStats();
            loadWords();
        } else {
            addLog(`❌ 修復エラー: ${result.detail}`, 'error');
        }
    } catch (error) {
        addLog(`❌ 通信エラー: ${error.message}`, 'error');
    }
}

// データベース状況確認
async function checkDatabaseStatus() {
    addLog('📊 データベース状況を確認中...');
    
    try {
        const response = await fetch('/api/admin/database-status');
        const result = await response.json();
        
        if (response.ok) {
            addLog(`🏥 全体状況: ${result.overall_status}`, 
                   result.overall_status === 'healthy' ? 'success' : 'error');
            
            // result.tables を参照するように修正
            if (result.tables) {
                Object.entries(result.tables).forEach(([table, status]) => {
                    if (status.exists) {
                        addLog(`✅ ${table}: ${status.count}件`, 'success');
                    } else {
                        addLog(`❌ ${table}: テーブル不存在`, 'error');
                    }
                });
            }
        } else {
            addLog(`❌ 状況確認エラー`, 'error');
        }
    } catch (error) {
        addLog(`❌ 通信エラー: ${error.message}`, 'error');
    }
}


// 完全パイプライン（全サイト・全カテゴリ）
async function runFullPipelineAll() {
    const articlesPerSite = document.getElementById('articlesPerSite').value;
    
    addLog(`🌐 全サイト・全カテゴリ収集開始 - 各サイト${articlesPerSite}件`);
    
    try {
        const formData = new FormData();
        formData.append('articles_per_site', articlesPerSite);
        
        const response = await fetch('/api/scraping/full-pipeline-all', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams(formData)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            addLog(`✅ 全カテゴリ収集完了`, 'success');
            addLog(`📊 収集: ${result.collected}件, 保存: ${result.saved}件`, 'info');
            addLog(`🔤 単語: ${result.words}個`, 'info');
            
            // カテゴリ別統計
            if (result.categories) {
                addLog(`📂 カテゴリ別統計:`, 'info');
                Object.entries(result.categories).forEach(([category, count]) => {
                    const categoryNames = {
                        'sports': 'スポーツ',
                        'entertainment': '芸能',
                        'politics': '政治',
                        'general': '総合'
                    };
                    addLog(`  ${categoryNames[category] || category}: ${count}件`, 'info');
                });
            }
            
            // ソース別統計
            if (result.sources) {
                addLog(`📰 ソース別統計:`, 'info');
                Object.entries(result.sources).forEach(([source, count]) => {
                    addLog(`  ${source}: ${count}件`, 'info');
                });
            }
            
            await loadStats();
            await loadWords();
        } else {
            addLog(`❌ エラー: ${result.detail || 'パイプライン実行失敗'}`, 'error');
        }
    } catch (error) {
        addLog(`❌ エラー: ${error.message}`, 'error');
    }
}

// 単語リスト読み込み
async function loadWords(page = 1, search = null) {
    try {
        let url = `/api/words/list?page=${page}&per_page=20`;
        if (search) {
            url += `&search=${encodeURIComponent(search)}`;
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (response.ok && !data.error) {
            displayWords(data.words);
            displayPagination(data.page, data.total_pages, data.search);
            currentPage = page;
        } else {
            document.getElementById('wordsArea').innerHTML = 
                '<div class="alert alert-warning">単語の読み込みに失敗しました</div>';
        }
    } catch (error) {
        document.getElementById('wordsArea').innerHTML = 
            '<div class="alert alert-danger">単語の読み込みでエラーが発生しました</div>';
    }
}

// 単語表示
function displayWords(words) {
    if (!words || words.length === 0) {
        document.getElementById('wordsArea').innerHTML = 
            '<div class="alert alert-info">単語が見つかりませんでした</div>';
        return;
    }
    
    const wordsHTML = `
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>単語</th>
                        <th>分類</th>
                        <th>頻度</th>
                        <th>重要度</th>
                        <th>記事</th>
                        <th>出現文脈</th>
                    </tr>
                </thead>
                <tbody>
                    ${words.map(word => `
                        <tr>
                            <td>
                                <span class="fw-bold text-primary">${word.word}</span>
                            </td>
                            <td>
                                <span class="badge bg-secondary">${getWordTypeLabel(word.word_type)}</span>
                            </td>
                            <td>
                                <span class="badge bg-info">${word.frequency}</span>
                            </td>
                            <td>
                                <div class="progress" style="width: 60px;">
                                    <div class="progress-bar" role="progressbar" 
                                         style="width: ${word.importance_score * 100}%"
                                         title="${word.importance_score}">
                                    </div>
                                </div>
                            </td>
                            <td>
                                <a href="${word.article_url}" target="_blank" 
                                   class="text-decoration-none" title="${word.article_title}">
                                    <small>
                                        ${word.article_title.length > 30 ? 
                                          word.article_title.substring(0, 30) + '...' : 
                                          word.article_title}
                                    </small>
                                    <br>
                                    <span class="badge bg-light text-dark">${word.article_source}</span>
                                </a>
                            </td>
                            <td>
                                <small class="text-muted" title="${word.context}">
                                    ${word.context ? 
                                      (word.context.length > 50 ? word.context.substring(0, 50) + '...' : word.context) : 
                                      ''}
                                </small>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
    
    document.getElementById('wordsArea').innerHTML = wordsHTML;
}

// 単語タイプラベル
function getWordTypeLabel(type) {
    const labels = {
        'proper_nouns': '固有名詞',
        'common_nouns': '一般名詞',
        'keywords': 'キーワード',
        'important_terms': '重要語句'
    };
    return labels[type] || type;
}

// ページネーション表示
function displayPagination(currentPage, totalPages, search) {
    if (totalPages <= 1) {
        document.getElementById('wordsPagination').innerHTML = '';
        return;
    }
    
    let paginationHTML = '<ul class="pagination pagination-sm justify-content-center">';
    
    // 前のページ
    if (currentPage > 1) {
        paginationHTML += `<li class="page-item">
            <a class="page-link" href="#" onclick="loadWords(${currentPage - 1}, '${search || ''}')">前</a>
        </li>`;
    }
    
    // ページ番号
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        paginationHTML += `<li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="loadWords(${i}, '${search || ''}')">${i}</a>
        </li>`;
    }
    
    // 次のページ
    if (currentPage < totalPages) {
        paginationHTML += `<li class="page-item">
            <a class="page-link" href="#" onclick="loadWords(${currentPage + 1}, '${search || ''}')">次</a>
        </li>`;
    }
    
    paginationHTML += '</ul>';
    document.getElementById('wordsPagination').innerHTML = paginationHTML;
}

// 単語検索
async function searchWords() {
    const searchTerm = document.getElementById('wordSearch').value.trim();
    if (searchTerm) {
        await loadWords(1, searchTerm);
    } else {
        await loadWords(1);
    }
}

// ページ読み込み時の初期化
document.addEventListener('DOMContentLoaded', function() {
    loadStats();
    loadWords();
    
    // 検索ボックスでEnterキー対応
    const searchInput = document.getElementById('wordSearch');
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWords();
            }
        });
    }
    
    addLog('🚀 拡張管理画面を初期化しました');
});

// 統計情報読み込み
async function loadStats() {
    try {
        const response = await fetch('/api/scraping/stats');
        const stats = await response.json();
        
        if (response.ok) {
            const statsHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="text-center">
                        <div class="text-3xl font-bold text-primary-600">${stats.articles.total}</div>
                        <div class="text-sm text-gray-600">記事数</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-green-600">${stats.words.total}</div>
                        <div class="text-sm text-gray-600">抽出単語数</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-yellow-600">${stats.ogiri_topics || 0}</div>
                        <div class="text-sm text-gray-600">お題数</div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-blue-600">${stats.training_topics || 0}</div>
                        <div class="text-sm text-gray-600">学習データ</div>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">ソース別統計</h3>
                    <div class="flex flex-wrap gap-2">
                        ${Object.entries(stats.articles.sources || {}).map(([source, count]) => 
                            `<span class="px-3 py-1 bg-blue-100 text-blue-800 text-sm font-medium rounded-full">${source}: ${count}件</span>`
                        ).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('statsArea').innerHTML = statsHTML;
        }
    } catch (error) {
        document.getElementById('statsArea').innerHTML = 
            '<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">統計情報の読み込みでエラーが発生しました</div>';
    }
}

// その他の既存関数
async function initSampleData() {
    addLog('🎲 サンプルデータを投入中...');
    
    try {
        const response = await fetch('/api/admin/init-sample-data', {method: 'POST'});
        const result = await response.json();
        
        if (response.ok) {
            addLog(`✅ ${result.message}`, 'success');
            loadStats();
        } else {
            addLog(`❌ エラー: ${result.detail || result.message}`, 'error');
        }
    } catch (error) {
        addLog(`❌ 通信エラー: ${error.message}`, 'error');
    }
}

async function checkStats() {
    addLog('📊 統計情報を確認中...');
    
    try {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        
        if (response.ok && !stats.error) {
            addLog(`📰 記事数: ${stats.news_articles}件`, 'success');
            addLog(`🔤 単語数: ${stats.extracted_words}個`, 'success');
            addLog(`🎯 お題数: ${stats.ogiri_topics}個`, 'success');
        } else {
            addLog(`⚠️ 統計取得エラー: ${stats.error || '不明なエラー'}`, 'error');
        }
    } catch (error) {
        addLog(`❌ 統計確認エラー: ${error.message}`, 'error');
    }
}
</script>
{% endblock %}
