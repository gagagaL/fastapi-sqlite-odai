<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-primary-600 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center text-white text-xl font-bold">
                        🎭 大喜利お題ジェネレーター
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="text-white hover:text-primary-200 px-3 py-2 rounded-md text-sm font-medium transition-colors">ホーム</a>
                    <a href="/topic" class="text-white hover:text-primary-200 px-3 py-2 rounded-md text-sm font-medium transition-colors">お題表示</a>
                    <a href="/admin" class="text-white hover:text-primary-200 px-3 py-2 rounded-md text-sm font-medium transition-colors">管理画面</a>
                    <a href="/docs" target="_blank" class="text-white hover:text-primary-200 px-3 py-2 rounded-md text-sm font-medium transition-colors">API仕様</a>
                </div>
                <!-- Mobile menu button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-button" class="text-white hover:text-primary-200 focus:outline-none focus:text-primary-200">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="md:hidden hidden">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-primary-700">
                <a href="/" class="text-white hover:text-primary-200 block px-3 py-2 rounded-md text-base font-medium">ホーム</a>
                <a href="/topic" class="text-white hover:text-primary-200 block px-3 py-2 rounded-md text-base font-medium">お題表示</a>
                <a href="/admin" class="text-white hover:text-primary-200 block px-3 py-2 rounded-md text-base font-medium">管理画面</a>
                <a href="/docs" target="_blank" class="text-white hover:text-primary-200 block px-3 py-2 rounded-md text-base font-medium">API仕様</a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1">
        <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 border-t border-gray-200">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-600 text-sm">© 2025 大喜利お題ジェネレーター</p>
        </div>
    </footer>

    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });
    </script>
    <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
