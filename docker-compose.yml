services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 開発時のコード変更のみマウント
      - ./app:/app/app
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    restart: unless-stopped
    # 起動前にディレクトリ作成
    command: sh -c "mkdir -p /app/data/database /app/logs && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"